<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .photo-panel {
            position: relative;
            width: 100%;
            padding-top: 100%; /* Makes it square */
            background-size: cover;
            background-position: center;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s ease-in-out;
        }

        .photo-panel:hover {
            transform: scale(1.05);
        }

        .photo-panel a {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            background: rgba(0, 0, 0, 0.5);
            transition: background 0.3s ease-in-out;
        }

        .photo-panel a:hover {
            background: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="bg-dark text-white py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="mb-0"><a href="index.html" class="text-white text-decoration-none">Harufumi Nakazawa</a></h1>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a href="index.html" class="nav-link text-white">Home</a></li>
                    <li class="nav-item"><a href="research.html" class="nav-link text-white active">Research</a></li>
                    <li class="nav-item"><a href="photography.html" class="nav-link text-white">Photography</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="photo-grid">
            <div class="photo-panel" style="background-image: url('images/asia.jpg');">
                <a href="asia.html">Asia</a>
            </div>
            <div class="photo-panel" style="background-image: url('images/americas.jpg');">
                <a href="americas.html">Americas</a>
            </div>
            <div class="photo-panel" style="background-image: url('images/europe.jpg');">
                <a href="europe.html">Europe</a>
            </div>
            <div class="photo-panel" style="background-image: url('images/amherst.jpg');">
                <a href="amherst.html">Amherst College</a>
            </div>
        </div>
    </main>

</body>
</html>
