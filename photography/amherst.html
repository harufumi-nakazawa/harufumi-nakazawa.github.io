                <p class="caption">Bicentennial Celebration (2021)</p>
            </div>
            <div class="photo">
                <img src="../images/amherst_memorial.jpg" alt="Memorial Hill (2020)">

            <div class="photo">
                <img src="../images/amherst_fall.jpg" alt="First Year Quad (2020)">

            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .caption {
            font-family: 'Crimson Text', serif;
            font-style: italic;
            font-size: 1rem;
