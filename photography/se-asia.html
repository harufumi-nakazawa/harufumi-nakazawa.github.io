<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southeast Asia - Harufumi Nakazawa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header class="bg-dark text-white py-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="mb-0"><a href="../index.html" class="text-white text-decoration-none">Harufumi Nakazawa</a></h1>
            <nav>
                <ul class="nav">
                    <li class="nav-item"><a href="../index.html" class="nav-link text-white">Home</a></li>
                    <li class="nav-item"><a href="../research.html" class="nav-link text-white">Research</a></li>
                    <li class="nav-item"><a href="../photography.html" class="nav-link text-white active">Photography</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mt-5">
        <h2 class="text-center">Southeast Asia</h2>

        <div class="photo-gallery">
            <div class="photo">
                <img src="../images/asia.jpg" alt="Bagan, Myanmar (2016)">
                <p class="caption">Bagan, Myanmar (2016)</p>
            </div>
            <div class="photo">
                <img src="../images/lombok.jpg" alt="Lombok, Indonesia (2016)">
                <p class="caption">Lombok, Indonesia (2016)</p>
            </div>
            <div class="photo">
                <img src="../images/angkor.jpg" alt="Siem Reap, Cambodia (2016)">
                <p class="caption">Siem Reap, Cambodia (2016)</p>
            </div>
            <div class="photo">
                <img src="../images/yangon.jpg" alt="Yangon, Myanmar (2016)">
                <p class="caption">Yangon, Myanmar (2016)</p>
            </div>
        </div>
    </div>

    <style>
        .photo-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }

        .photo img {
            width: 100%;
            max-width: 900px;
            display: block;
            border-radius: 0; /* Removed rounded corners */
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
        }

        .caption {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 1rem;
            color: #555;
            text-align: center;
            margin-top: 8px;
        }
        /* Apply Cormorant Garamond font to all headings */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Cormorant Garamond', serif;
        }

        .nav .nav-link {
            font-family: 'Lora', serif;
        }
    </style>
</body>
</html>
